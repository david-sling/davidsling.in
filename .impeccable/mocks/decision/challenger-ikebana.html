<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Ma Arrangement — sketch</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;600&display=swap" rel="stylesheet">
<style>
:root{--plaster:#e9e5dc;--pine:#6b5f52;--iris:#3b5bbf;--bronze:#4a3b2a}
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:var(--plaster);color:var(--bronze);font-family:'Hanken Grotesk',sans-serif}
.name{position:absolute;left:120px;top:90px;writing-mode:vertical-rl;font-size:64px;font-weight:300;letter-spacing:.2em}
.stem{position:absolute;bottom:150px;width:6px;background:var(--pine);transform-origin:bottom center;border-radius:3px}
.bloom{position:absolute;width:260px;height:170px;background:#fff;border:2px solid var(--iris);border-radius:6px}
.bloom b{position:absolute;left:14px;bottom:-34px;font-size:24px;font-weight:600;color:var(--bronze)}
.vessel{position:absolute;left:640px;bottom:110px;width:360px;height:44px;background:var(--bronze);border-radius:4px 4px 30px 30px}
</style></head><body>
<div class="name">DAVID SLING</div>
<div class="stem" style="left:800px;height:600px;transform:rotate(-12deg)"></div>
<div class="stem" style="left:820px;height:380px;transform:rotate(38deg)"></div>
<div class="stem" style="left:780px;height:240px;transform:rotate(-58deg)"></div>
<div class="bloom" style="left:560px;top:90px"><b>Wave</b></div>
<div class="bloom" style="left:1010px;top:330px;width:220px;height:150px"><b>Equanim</b></div>
<div class="bloom" style="left:470px;top:520px;width:190px;height:130px"><b>Offlyn</b></div>
<div class="vessel"></div>
</body></html>
